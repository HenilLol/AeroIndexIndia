<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background glow & gradients -->
    <radialGradient id="aero-radar-glow" cx="64" cy="64" r="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5FE0CF" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#0E7490" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#07141D" stop-opacity="0" />
    </radialGradient>
    
    <linearGradient id="aero-arc-grad" x1="20" y1="100" x2="108" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#5FE0CF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#A5F3FC" stop-opacity="1" />
    </linearGradient>

    <linearGradient id="aero-wing-port" x1="42" y1="42" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A5F3FC" />
      <stop offset="40%" stop-color="#5FE0CF" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>

    <linearGradient id="aero-wing-starboard" x1="48" y1="48" x2="86" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5FE0CF" />
      <stop offset="60%" stop-color="#0F766E" />
      <stop offset="100%" stop-color="#115E59" />
    </linearGradient>

    <linearGradient id="aero-fuselage" x1="38" y1="90" x2="90" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#042F2E" />
      <stop offset="30%" stop-color="#0F766E" />
      <stop offset="70%" stop-color="#5FE0CF" />
      <stop offset="100%" stop-color="#F0FDFA" />
    </linearGradient>

    <linearGradient id="aero-trail" x1="64" y1="64" x2="28" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5FE0CF" stop-opacity="0.9" />
      <stop offset="45%" stop-color="#38BDF8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0" />
    </linearGradient>

    <!-- Drop shadow filter -->
    <filter id="aero-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circular Telemetry Ground & Index Dial -->
  <circle cx="64" cy="64" r="58" fill="url(#aero-radar-glow)" />

  <!-- Outer Index Ring with Calibration Marks -->
  <circle cx="64" cy="64" r="56" stroke="#5FE0CF" stroke-width="1.2" stroke-opacity="0.25" stroke-dasharray="3 5" />
  <circle cx="64" cy="64" r="47" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.35" />
  <circle cx="64" cy="64" r="38" stroke="#5FE0CF" stroke-width="0.8" stroke-opacity="0.18" stroke-dasharray="1.5 3.5" />

  <!-- Cardinal Ticks (Instrument Airspace Calibrations) -->
  <line x1="64" y1="5" x2="64" y2="11" stroke="#5FE0CF" stroke-width="2" stroke-linecap="round" opacity="0.8" />
  <line x1="64" y1="117" x2="64" y2="123" stroke="#5FE0CF" stroke-width="2" stroke-linecap="round" opacity="0.5" />
  <line x1="5" y1="64" x2="11" y2="64" stroke="#5FE0CF" stroke-width="2" stroke-linecap="round" opacity="0.5" />
  <line x1="117" y1="64" x2="123" y2="64" stroke="#5FE0CF" stroke-width="2" stroke-linecap="round" opacity="0.8" />

  <!-- 45-degree Minor Dial Ticks -->
  <line x1="22" y1="22" x2="26" y2="26" stroke="#38BDF8" stroke-width="1.2" stroke-linecap="round" opacity="0.4" />
  <line x1="102" y1="102" x2="106" y2="106" stroke="#38BDF8" stroke-width="1.2" stroke-linecap="round" opacity="0.4" />
  <line x1="102" y1="26" x2="106" y2="22" stroke="#38BDF8" stroke-width="1.2" stroke-linecap="round" opacity="0.6" />
  <line x1="22" y1="106" x2="26" y2="102" stroke="#38BDF8" stroke-width="1.2" stroke-linecap="round" opacity="0.4" />

  <!-- Orbital Flight Path Arc (Curving through national airspace) -->
  <path d="M 20 86 A 50 50 0 0 1 86 20" stroke="url(#aero-arc-grad)" stroke-width="2.5" stroke-linecap="round" filter="url(#aero-glow)" />

  <!-- Signal Blips / Waypoint Nodes -->
  <circle cx="86" cy="20" r="3" fill="#A5F3FC" filter="url(#aero-glow)" />
  <circle cx="48" cy="28" r="1.8" fill="#5FE0CF" opacity="0.75" />
  <circle cx="28" cy="48" r="1.8" fill="#5FE0CF" opacity="0.6" />
  <circle cx="20" cy="86" r="2.2" fill="#38BDF8" opacity="0.8" />
  <circle cx="100" cy="50" r="1.5" fill="#38BDF8" opacity="0.5" />

  <!-- Vector Contrail Trails -->
  <path d="M 64 64 L 32 96" stroke="url(#aero-trail)" stroke-width="3" stroke-linecap="round" />
  <path d="M 61 67 L 35 93" stroke="url(#aero-trail)" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="2 3" opacity="0.7" />
  <path d="M 67 61 L 41 87" stroke="url(#aero-trail)" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="2 3" opacity="0.7" />

  <!-- Precision Aircraft Vector (Rotated 45° climbing NE) -->
  <g transform="translate(64, 64) rotate(-45) translate(-64, -64)" filter="url(#aero-glow)">
    <!-- Shadowed Ventral Fuselage -->
    <path d="M 64 24 L 56 68 L 64 64 L 72 68 Z" fill="#042F2E" opacity="0.6" />

    <!-- Port / Left Wing & Elevon (Faceted Teal) -->
    <path d="M 64 28 L 64 64 L 34 68 L 44 60 L 61 50 Z" fill="url(#aero-wing-port)" />
    
    <!-- Starboard / Right Wing & Elevon (Deep Faceted Teal) -->
    <path d="M 64 28 L 64 64 L 94 68 L 84 60 L 67 50 Z" fill="url(#aero-wing-starboard)" />

    <!-- Port Winglet / Wingtip Marker -->
    <path d="M 34 68 L 30 63 L 44 60 Z" fill="#2DD4BF" />

    <!-- Starboard Winglet / Wingtip Marker -->
    <path d="M 94 68 L 98 63 L 84 60 Z" fill="#0D9488" />

    <!-- Twin Stabilizer Fins (Tail) -->
    <path d="M 60 63 L 53 82 L 61 77 Z" fill="#14B8A6" />
    <path d="M 68 63 L 75 82 L 67 77 Z" fill="#0F766E" />

    <!-- Main Aerodynamic Fuselage Spine (Luminous Needle) -->
    <path d="M 64 20 L 67 48 L 64 78 L 61 48 Z" fill="url(#aero-fuselage)" />

    <!-- Supersonic Cockpit Canopy Glass -->
    <path d="M 64 34 L 66 45 L 64 48 L 62 45 Z" fill="#F0FDFA" opacity="0.95" />

    <!-- Center Navigation Light Dot -->
    <circle cx="64" cy="22" r="1.5" fill="#FFFFFF" />
  </g>

  <!-- Outer Ring Accent Index Arc -->
  <path d="M 108 78 A 56 56 0 0 1 78 120" stroke="#5FE0CF" stroke-width="1.8" stroke-dasharray="2 4" opacity="0.4" />
</svg>
